    <style>
        .container {
            text-align: center; /* Centraliza as imagens */
        }
        .imagem {
            display: inline-block;
            margin-right: 10px; /* Espaço entre as imagens */
        }
        /* Estilo do rodapé fixado no final da página */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }
        footer a {
            color: #ffcc00;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        /* Estilo para a galeria de imagens */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .gallery img {
            margin: 10px;
            width: 150px;
            height: auto;
            cursor: pointer;
        }
        /* Estilo do botão de toggle */
        .toggle-button img {
            width: 50px;  /* Tamanho do ícone PNG */
            cursor: pointer;
        }
    </style>
</head>
